
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: footprint_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-footprint_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d footprint_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/footprint_review
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-footprint_demo}
      SPRING_PROFILES_ACTIVE: demo
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in the backend .env file}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
